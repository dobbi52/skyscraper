<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="1층부터 5층까지 건물을 세우는 높이 단서 논리 퍼즐. 오늘의 퍼즐로 별을 모아 나만의 픽셀 도시를 키워요.">
<title>스카이스크래퍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+KR:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* 레이아웃: 위쪽 모드·크기 막대 아래에 판(왼쪽)과 조작 카드(오른쪽). 좁은 화면에서는 한 줄로 쌓는다. */
:root {
  --bg: #1a2150;
  --fg: #f4ecd6;
  --panel: #2c3a7c;
  --panel-deep: #222c62;
  --ink: #0c1132;
  --orange: #ff8a5c;
  --sky: #5fd3f3;
  --pink: #ff6b9a;
  --purple: #b493ff;
  --lime: #7ee08a;
  --gold: #ffd166;
  --cream: #f4ecd6;
  --cream-edge: #cdbf93;
  --muted: #c4ccea;
  --edge: #4a5ca6;
  --red: #ef476f;
  --green: #6fbf73;
  --hint: #d6ecff;
  --f-pixel: 'Press Start 2P', monospace;
  --f-ko: 'DotGothic16', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1.6px), radial-gradient(rgba(255, 209, 102, 0.07) 1px, transparent 1.6px);
  background-size: 28px 28px, 44px 44px;
  background-position: 0 0, 13px 19px;
  color: var(--fg);
  font-family: var(--f-ko);
  font-size: 16px;
  line-height: 1.4;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, .cell:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img { max-width: none; }

/* 상단 */
.top {
  display: grid; align-items: center; gap: 12px;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "brand act" "nav nav";
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 40px; width: auto; display: block; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 400; color: var(--gold); letter-spacing: 0.02em; text-shadow: 2px 2px 0 #d1495b; white-space: nowrap; }
.top-actions { grid-area: act; display: flex; gap: 8px; }
.btn.icon { width: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--gold); }
.btn.icon img { width: 26px; height: auto; display: block; }
@media (max-width: 860px) {
  .brand h1 { font-size: 22px; }
  .brand img { height: 32px; }
}
/* 모드 탭 + 그 아래 난이도 띠 (난이도는 탭에 딸린 선택) */
.modenav { grid-area: nav; display: flex; flex-direction: column; min-width: 0; --mc: var(--gold); }
.modenav.practice { --mc: var(--orange); }
.tabs { display: flex; gap: 6px; }
.tabs .tab {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; font-size: 16px;
  background: var(--panel-deep); color: var(--muted); border: 3px solid var(--edge); border-bottom: none; border-radius: 0;
}
.tabs .tab .ico { width: 20px; height: auto; display: block; }
.tabs .tab .star { font-size: 17px; color: var(--gold); line-height: 1; }
.tabs .tab[aria-pressed="true"] { background: var(--mc); border-color: var(--mc); color: var(--ink); }
.tabs .tab[aria-pressed="true"] .star { color: var(--ink); }
.lvstrip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--mc); border: 3px solid var(--mc); padding: 8px 10px; }
.lvstrip .lb { font-size: 14px; color: var(--ink); margin-right: 4px; }
.lvstrip button {
  min-height: 38px; padding: 0 16px; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
  background: #fff6d6; color: #263259; border: 2px solid var(--ink); border-radius: 0;
}
.lvstrip [data-lv="easy"] { --c: var(--lime); }
.lvstrip [data-lv="normal"] { --c: var(--sky); }
.lvstrip [data-lv="hard"] { --c: var(--pink); }
.lvstrip button[aria-pressed="true"] { background: var(--ink); color: var(--c); }
.lvstrip .mark { font-size: 13px; }
@media (max-width: 520px) {
  .tabs .tab { flex: 1; justify-content: center; padding: 0 8px; }
  .lvstrip { display: grid; grid-template-columns: auto 1fr 1fr 1fr; }
  .lvstrip button { justify-content: center; padding: 0 6px; }
}
.btn {
  min-height: 44px; padding: 0 16px; font-size: 16px;
  background: var(--panel); color: var(--muted);
  border: 3px solid var(--edge); border-radius: 0;
}
.btn:active { transform: translateY(2px); }
.btn.solid { background: var(--cream); color: #263259; border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.solid:active { box-shadow: 0 2px 0 var(--ink); }
.btn.gold { background: var(--gold); color: var(--ink); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.green { background: var(--green); color: var(--ink); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 20px; min-height: 52px; }
.btn.on { background: var(--gold); color: var(--ink); border-color: var(--ink); }
.btn[disabled] { opacity: 0.45; cursor: default; transform: none; }

body { --lv: var(--sky); }
body[data-lv="easy"] { --lv: var(--lime); }
body[data-lv="hard"] { --lv: var(--pink); }
.seg .mark { margin-left: 6px; font-size: 13px; }

/* 게임 영역 */
.game { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 16px; }
@media (max-width: 780px) {
  .game { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .game .side { display: contents; }
  #statusCard { order: -1; }
  .game .board-wrap { order: 0; }
  .game .pad { order: 1; }
  #miniCity { order: 2; }
}
.board-wrap { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.banner { background: var(--panel); border: 3px solid var(--ink); padding: 10px 14px; font-size: 15px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.banner b { color: var(--gold); font-weight: 400; }
.banner.win { border-color: var(--green); color: var(--fg); }
.banner.lose { border-color: var(--red); color: var(--fg); }
.board-panel { background: var(--panel); border: 3px solid var(--lv); box-shadow: 0 6px 0 var(--ink); padding: 14px; max-width: 580px; width: 100%; margin: 0 auto; }
@media (max-width: 480px) { .board-panel { padding: 8px; } }
.board { display: grid; gap: 4px; grid-template-columns: repeat(var(--cols, 7), minmax(0, 1fr)); }
.blank { aspect-ratio: 1; }
.clue { aspect-ratio: 1; container-type: inline-size; display: grid; place-items: center; }
.clue span { font-family: var(--f-pixel); font-size: max(11px, 28cqw); color: var(--gold); }
.clue.ok span { color: var(--green); }
.cell {
  position: relative; aspect-ratio: 1; container-type: inline-size; padding: 0; overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center;
  background: var(--cream); border: 2px solid var(--cream-edge); border-radius: 0;
}
.cell .bld { display: block; width: auto; margin-bottom: 4cqw; pointer-events: none; }
.cell .num { position: absolute; top: 5cqw; left: 7cqw; font-family: var(--f-pixel); font-size: max(8px, 16cqw); color: #263259; pointer-events: none; }
.cell .memo { position: absolute; inset: 8cqw; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); align-items: center; justify-items: center; font-size: max(10px, 22cqw); color: #4d5a8c; pointer-events: none; }
.cell .memo i { font-style: normal; }
.cell.fixed { background: var(--hint); border-color: #7fb8e6; }
.cell.given { background: #e3d3a1; border-color: #a8975f; }
.cell.given .num { color: #7a5a00; }
.cell.sel { background: #fff0b3; border: 3px solid #ffb703; }
.cell.dup, .cell.wrong { background: #ffd0d8; border: 3px solid var(--red); }
.cell.dup .num, .cell.wrong .num { color: #b0123a; }
.cell[disabled] { cursor: default; }

/* 오른쪽 카드 */
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); padding: 14px 16px; min-width: 0; }
.status { display: grid; grid-template-columns: auto 1fr auto; justify-items: center; align-items: center; gap: 10px; padding: 10px 14px; border-top: 3px solid var(--lv); }
.status .st-v { white-space: nowrap; font-size: 16px; color: var(--fg); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.status .st-v img { width: 20px; height: auto; display: block; }
.status > :first-child { justify-self: start; }
.status .st-r { text-align: right; justify-self: end; }
.status .hearts { margin-top: 0; }
#btnMemo { color: var(--purple); border-color: var(--purple); }
#btnMemo.on { background: var(--purple); color: var(--ink); }
#btnHint { background: var(--sky); border-color: var(--ink); }
.stat-num.sky { color: var(--sky); }
.status .lbl { font-size: 14px; color: var(--muted); }
.hearts { display: flex; gap: 6px; margin-top: 6px; min-height: 24px; align-items: center; }
.hearts.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.stat-num { font-family: var(--f-pixel); font-size: 18px; color: var(--gold); margin-top: 8px; }
.pad { display: flex; flex-direction: column; gap: 12px; }
.padrow { display: flex; gap: 8px; }
.pbtn {
  flex: 1; min-width: 0; height: 84px; padding: 0 0 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
  background: var(--cream); color: #263259; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 0;
}
.pbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.pbtn img { display: block; width: auto; }
.pbtn b { font-family: var(--f-pixel); font-size: 12px; font-weight: 400; }
.pbtn.done { opacity: 0.45; }
#btnErase.brush { background: #fff0b3; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--ink); }
.padrow.nudge .pbtn { animation: nudge 0.45s steps(3) 2; }
@keyframes nudge { 50% { transform: translateY(-6px); border-color: var(--gold); } }
.pbtn.brush { background: #fff0b3; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--ink); transform: translateY(-3px); opacity: 1; }
.tools { display: flex; gap: 8px; }
.tools .btn { flex: 1; padding: 0 6px; font-size: 15px; }
.mini { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.mini .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.chip { font-family: var(--f-pixel); font-size: 11px; color: var(--ink); background: var(--gold); padding: 5px 7px; }
.blocks { display: flex; gap: 3px; }
.blocks i { width: 18px; height: 12px; background: var(--bg); border: 2px solid var(--ink); }
.blocks i.on { background: var(--gold); }

/* 장면 */
.scene { position: relative; width: 100%; aspect-ratio: 906 / 360; background: #001c4e; overflow: hidden; }
.scene img { position: absolute; display: block; height: auto; max-width: none; }
.scene .sky { left: 0; top: 0; width: 100%; height: 83.9%; }
.scene .grass { left: 0; bottom: 0; width: 100%; height: 17.4%; }
.scene .ghost { opacity: 0.4; filter: grayscale(1) brightness(1.15); }

/* 도시 화면 */
.cityhead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-top: 16px; }
.cityhead h2 { margin: 0; font-size: 26px; font-weight: 400; color: var(--gold); }
.cityhead .left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.cityhead .right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
.scenecard { margin-top: 14px; background: var(--ink); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); max-width: 1000px; }
.dex { margin-top: 22px; display: flex; flex-direction: column; gap: 20px; }
.dexgroup { --tone: var(--gold); --tone-dim: #7a6a3a; }
.dexgroup.brick { --tone: #ff8a5c; --tone-dim: #8a4f3a; }
.dexgroup.special { --tone: #5fd3f3; --tone-dim: #3a6f82; }
.dexhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 3px solid var(--tone); }
.dexhead h3 { margin: 0; font-size: 18px; font-weight: 400; color: var(--tone); display: flex; align-items: center; gap: 8px; }
.dexhead h3 img { height: 18px; width: auto; display: block; }
.dexhead .how { font-size: 14px; color: var(--muted); }
.dexhead .have { margin-left: auto; font-family: var(--f-pixel); font-size: 12px; color: var(--ink); background: var(--tone); padding: 5px 8px; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.dexitem { display: flex; align-items: center; gap: 10px; padding: 10px; background: #34437a; border: 2px solid var(--tone); min-width: 0; }
.dexitem.locked { background: var(--panel-deep); border: 2px dashed var(--tone-dim); }
.dexitem .nt b { font-weight: 400; color: var(--tone); }
.dexrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.owned { flex: 1 1 280px; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 10px 12px; background: #34437a; border: 2px solid var(--tone); min-height: 70px; }
.owned img { width: 48px; height: 46px; object-fit: contain; object-position: bottom; display: block; }
.owned .none { color: var(--muted); font-size: 14px; align-self: center; }
.nextcard { flex: 0 1 240px; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel-deep); border: 2px dashed var(--tone); }
.nextcard .q { flex: none; width: 46px; height: 46px; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 20px; color: var(--tone); border: 2px solid var(--tone); }
.nextcard .info { flex: 1; min-width: 0; }
.nextcard .nm { font-size: 15px; }
.nextcard .nt { font-size: 14px; color: var(--tone); }
.nextcard .bar { height: 8px; background: var(--ink); margin-top: 5px; }
.nextcard .bar i { display: block; height: 100%; background: var(--tone); }
.tchips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tchip { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; padding: 3px 8px; border: 2px solid; }
.tchip img { height: 14px; width: auto; display: block; }
.tchip.star { color: var(--gold); border-color: var(--gold); }
.tchip.brick { color: #ff8a5c; border-color: #ff8a5c; }
.tchip.special { color: #5fd3f3; border-color: #5fd3f3; }
.dexitem .ic { width: 44px; height: 44px; flex: none; display: grid; place-items: end center; }
.dexitem img { width: 44px; height: 44px; object-fit: contain; object-position: bottom; display: block; }
.dexitem.locked img { opacity: 0.55; filter: grayscale(1) brightness(0.85); }
.dexitem .nm { font-size: 16px; }
.dexitem .nt { font-size: 13px; color: var(--muted); }
.dexitem.locked .nm, .dexitem.locked .nt { color: #a9b3d6; }
.backrow { margin-top: 22px; }

/* 모달, 안내 */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 20, 0.78); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: 100%; max-width: 480px; max-height: 100%; overflow: auto; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { margin: 0; font-size: 22px; font-weight: 400; color: var(--gold); }
.dialog p { margin: 0; font-size: 15px; color: var(--fg); line-height: 1.55; }
.dialog ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; }
.mactions { display: flex; gap: 8px; flex-wrap: wrap; }
.mactions .btn { flex: 1; }
.example { display: flex; align-items: flex-end; justify-content: center; gap: 12px; background: var(--panel-deep); padding: 14px 10px 10px; border: 2px solid var(--edge); }
.example .col { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.example .col img { display: block; width: auto; }
.example .eye { font-size: 14px; color: var(--gold); align-self: center; padding-left: 8px; }
.newitems { display: flex; flex-direction: column; gap: 8px; }
.newitem { display: flex; align-items: center; gap: 12px; background: #34437a; border: 2px solid var(--gold); padding: 8px 10px; }
.newitem img { width: 56px; height: 56px; object-fit: contain; object-position: bottom; display: block; }
.bigstar { font-family: var(--f-pixel); font-size: 22px; color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; max-width: min(92vw, 420px); background: var(--ink); color: var(--cream); border: 3px solid var(--gold); padding: 10px 16px; font-size: 15px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.toast.show { opacity: 1; }
.loading { color: var(--muted); font-size: 15px; padding: 24px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .hearts.shake { animation: none; } .toast { transition: none; } }
/* 통합 계정 */
.btn.acc { font-size: 14px; color: var(--gold); padding: 0 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 18px; min-height: 16px; }
.sync.off, .sync.old { color: var(--pink); }
.gate { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.gate-box { max-width: 360px; width: 100%; text-align: center; background: var(--panel); border: 3px solid var(--gold); box-shadow: 0 6px 0 var(--ink); padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.gate-box img { height: 64px; width: auto; }
.gate-box h2 { margin: 0; font-size: 26px; font-weight: 400; color: var(--gold); text-shadow: 2px 2px 0 #d1495b; }
.gate-box p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--fg); }
.gate-box .btn { width: 100%; min-height: 50px; font-size: 18px; }
@media (max-width: 420px) { .btn.acc { max-width: 96px; font-size: 13px; padding: 0 8px; } }
/* 설명형 힌트 */
.hintbox { background: #fff6d6; color: #263259; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 580px; width: 100%; margin: 0 auto; }
.hintbox .hb-t { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #8a5a00; }
.hintbox .hb-ic { width: 24px; height: 24px; display: grid; place-items: center; background: var(--sky); color: var(--ink); font-family: var(--f-pixel); font-size: 12px; }
.hintbox p { margin: 0; font-size: 16px; line-height: 1.55; }
.hintbox .hb-a { display: flex; gap: 8px; flex-wrap: wrap; }
.hintbox .hb-a .btn { min-height: 40px; font-size: 15px; }
.hintbox .hb-a .btn:not(.solid) { background: #e9dfbf; color: #263259; border-color: var(--ink); }
.cell.hint-line { background: #dff3fb; border-color: #8fc9e0; }
.cell.hint-target { background: #fff0b3; border: 3px solid var(--sky); box-shadow: inset 0 0 0 3px #ffffff; animation: hintpulse 1s steps(2) infinite; }
@keyframes hintpulse { 50% { border-color: var(--gold); } }
.clue.hint-clue { background: var(--sky); }
.clue.hint-clue span { color: var(--ink); }
/* 놀이 방법 */
.helpbody { display: flex; flex-direction: column; gap: 14px; }
.helpbody .hl, .helpbody .cap { margin: 0; font-size: 16px; line-height: 1.6; text-align: center; text-wrap: balance; }
.helpbody b { font-weight: 400; color: var(--gold); }
.hx { display: flex; align-items: flex-end; justify-content: center; gap: 10px; background: var(--panel-deep); border: 2px solid var(--edge); padding: 14px 10px 10px; }

function xmur3(str) {

  for (var i = 0; i < line.length; i++) { if (line[i] > max) { max = line[i]; c++; } }

}
function randomLatin(n, rng) {
  var g = [];
  for (var i = 0; i < n; i++) g.push(new Array(n).fill(0));
  function fill(pos) {
    if (pos === n * n) return true;
    var r = (pos / n) | 0, c = pos % n;
    var cand = [];
    for (var v = 1; v <= n; v++) cand.push(v);
    shuffle(cand, rng);
    for (var k = 0; k < cand.length; k++) {
      var val = cand[k], ok = true, x;
      for (x = 0; x < c; x++) if (g[r][x] === val) { ok = false; break; }
      if (ok) for (x = 0; x < r; x++) if (g[x][c] === val) { ok = false; break; }
      if (ok) { g[r][c] = val; if (fill(pos + 1)) return true; g[r][c] = 0; }

  var n = g.length, top = [], bottom = [], left = [], right = [];

    top.push(visibleCount(col));
    bottom.push(visibleCount(col.slice().reverse()));
    left.push(visibleCount(g[i]));
    right.push(visibleCount(g[i].slice().reverse()));

function countSolutions(n, clues, limit, budget) {
  var g = [], rowMask = new Array(n).fill(0), colMask = new Array(n).fill(0);
  for (var i = 0; i < n; i++) g.push(new Array(n).fill(0));
  var count = 0, nodes = 0, aborted = false;
  function lineCheck(get, len, clue, complete) {
    var vis = 0, max = 0;
    for (var i = 0; i < len; i++) { var v = get(i); if (v > max) { max = v; vis++; } }
    if (clue == null) return true;
    if (vis > clue) return false;
    if (complete) return vis === clue;
    return vis + Math.min(n - len, n - max) >= clue;

  function endCheck(get, clue) {
    if (clue == null) return true;
    var vis = 0, max = 0;
    for (var i = n - 1; i >= 0; i--) { var v = get(i); if (v > max) { max = v; vis++; } }
    return vis === clue;
  }
  function cellOK(r, c) {
    var rowGet = function (i) { return g[r][i]; };

    if (!lineCheck(rowGet, c + 1, clues.left[r], c === n - 1)) return false;
    if (c === n - 1 && !endCheck(rowGet, clues.right[r])) return false;
    if (!lineCheck(colGet, r + 1, clues.top[c], r === n - 1)) return false;
    if (r === n - 1 && !endCheck(colGet, clues.bottom[c])) return false;

  }

/* 기본 규칙만으로 풀리는지 검사한다.
   규칙: 단서 1 → 맨 앞이 가장 높은 건물 / 단서 n → 1부터 차례로 /
   단서 k → 앞에서 d번째 칸은 n-k+1+d층을 넘지 못함 /
   한 칸에 하나만 남으면 확정 / 한 줄에서 그 높이가 들어갈 곳이 하나뿐이면 확정 */
function logicSolve(n, clues, givens) {
  var full = (1 << n) - 1, cand = [], r, c, i, d;
  for (r = 0; r < n; r++) { cand.push([]); for (c = 0; c < n; c++) cand[r].push(givens[r][c] ? 1 << (givens[r][c] - 1) : full); }

      var m = cand[r][c];
      if (!m) return false;
      if (!single(m)) continue;
      for (i = 0; i < n; i++) {
        if (i !== c && (cand[r][i] & m)) { cand[r][i] &= ~m; changed = true; }
        if (i !== r && (cand[i][c] & m)) { cand[i][c] &= ~m; changed = true; }
      }
    }
    for (var v = 0; v < n; v++) {
      var bit = 1 << v;
      for (i = 0; i < n; i++) {
        var rc = [], cc = [];
        for (var j = 0; j < n; j++) { if (cand[i][j] & bit) rc.push(j); if (cand[j][i] & bit) cc.push(j); }
        if (!rc.length || !cc.length) return false;
        if (rc.length === 1 && cand[i][rc[0]] !== bit) { cand[i][rc[0]] = bit; changed = true; }
        if (cc.length === 1 && cand[cc[0]][i] !== bit) { cand[cc[0]][i] = bit; changed = true; }
      }
    }
  }
  for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (!single(cand[r][c])) return false;

var LEVEL_RULES = {
  easy:   { givens: [7, 10], clues: 20, needMax: true },  /* needMax: 바깥 단서에 5가 꼭 하나 이상 */
  normal: { givens: [4, 7],  clues: 20 },

      group('special', '✦ ', '특별 장식', '연습을 많이 하면 열려요', '연습 ' + save.prac.total + '판', gSpecial);

  /* ===== 조작 ===== */
  function afterChange(focus) {
    G.wrong = null; G.hint = null;
    persistGame();
    renderBoard(focus); renderSide();
  }
  function selectCell(r, c, focus) {
    if (!canEdit()) return;
    G.sel = [r, c];
    renderBoard(focus);
  }
  function setValue(v) {
    if (!canEdit()) return;
    if (!G.sel) { toast('먼저 칸을 골라 주세요'); return; }
    var r = G.sel[0], c = G.sel[1], n = G.n;
    if (G.fixed[r][c] || G.puzzle.givens[r][c]) { toast(G.fixed[r][c] ? '힌트로 채운 칸이에요' : '처음부터 놓인 건물이에요'); return; }
    if (G.memoOn) {
      if (G.grid[r][c]) { toast('숫자가 들어간 칸에는 메모를 못 써요'); return; }
      G.memo[r][c] ^= (1 << (v - 1));
    } else if (G.grid[r][c] === v) {
      G.grid[r][c] = 0;
    } else {
      G.grid[r][c] = v; G.memo[r][c] = 0; G.justPlaced = r + ',' + c;
      for (var k = 0; k < n; k++) {
        G.memo[r][k] &= ~(1 << (v - 1));
        G.memo[k][c] &= ~(1 << (v - 1));
      }
    }
    afterChange(false);
  }
  function eraseCell() {
    if (!canEdit() || !G.sel) { if (canEdit()) toast('먼저 칸을 골라 주세요'); return; }
    var r = G.sel[0], c = G.sel[1];
    if (G.fixed[r][c] || G.puzzle.givens[r][c]) { toast(G.fixed[r][c] ? '힌트로 채운 칸이에요' : '처음부터 놓인 건물이에요'); return; }
    G.grid[r][c] = 0; G.memo[r][c] = 0;
    afterChange(false);
  }
  /* ===== 설명형 힌트: 지금 판에서 기본 규칙으로 바로 알 수 있는 칸과 그 이유를 찾는다 ===== */
  var SIDE_KO = { top: '위쪽', bottom: '아래쪽', left: '왼쪽', right: '오른쪽' };
  function lineCells(side, i, n) {
    var out = [];
    for (var d = 0; d < n; d++) {
      if (side === 'top') out.push([d, i]);
      else if (side === 'bottom') out.push([n - 1 - d, i]);
      else if (side === 'left') out.push([i, d]);
      else out.push([i, n - 1 - d]);
    }
    return out;
  }
  function listKo(vals) { return vals.join(', ') + '층'; }
  function explainStep() {
    var n = G.n, p = G.puzzle, sol = p.solution, clues = p.clues, grid = G.grid, r, c, v, i, d;
    var full = (1 << n) - 1;
    function bits(m) { var a = []; for (var x = 1; x <= n; x++) if (m & (1 << (x - 1))) a.push(x); return a; }
    function key(r, c) { return r + ',' + c; }
    /* 0. 틀린 칸이 있으면 먼저 짚어 준다 */
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (grid[r][c] && grid[r][c] !== sol[r][c]) {
        return { type: 'wrong', target: [r, c], cells: [], clues: [],
          text: (r + 1) + '번째 가로줄, ' + (c + 1) + '번째 세로줄 칸을 다시 생각해 봐요. 지금 들어간 ' + grid[r][c] + '층은 정답이 아니에요.' };
      }
    }
    /* 1. 줄 정보와 단서 제한 */
    var rowHas = [], colHas = [];
    for (i = 0; i < n; i++) { rowHas.push(0); colHas.push(0); }
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (grid[r][c]) { rowHas[r] |= 1 << (grid[r][c] - 1); colHas[c] |= 1 << (grid[r][c] - 1); }
    var clueMask = [], clueWhy = [];
    for (r = 0; r < n; r++) { clueMask.push([]); clueWhy.push([]); for (c = 0; c < n; c++) { clueMask[r].push(full); clueWhy[r].push([]); } }
    ['top', 'bottom', 'left', 'right'].forEach(function (sd) {
      for (var i2 = 0; i2 < n; i2++) {
        var k = clues[sd][i2];
        if (k == null) continue;
        lineCells(sd, i2, n).forEach(function (cell, d2) {
          var m;
          if (k === 1) m = d2 === 0 ? 1 << (n - 1) : full;
          else if (k === n) m = 1 << d2;
          else m = (1 << Math.min(n, n - k + 1 + d2)) - 1;
          if (m !== full) { clueMask[cell[0]][cell[1]] &= m; clueWhy[cell[0]][cell[1]].push({ side: sd, i: i2, k: k, d: d2, mask: m }); }
        });
      }
    });
    function latin(r, c) { return full & ~rowHas[r] & ~colHas[c]; }
    function single(m) { return m && !(m & (m - 1)); }
    function rowcolCells(r, c) {
      var a = [];
      for (var x = 0; x < n; x++) { if (x !== c) a.push(key(r, x)); if (x !== r) a.push(key(x, c)); }
      return a;
    }
    /* 2. 단서 1 / 단서 n 으로 바로 정해지는 칸 */
    var sides = ['top', 'bottom', 'left', 'right'];
    for (var si = 0; si < 4; si++) for (i = 0; i < n; i++) {
      var sd = sides[si], k = clues[sd][i];
      if (k !== 1 && k !== n) continue;
      var cells = lineCells(sd, i, n);
      for (d = 0; d < n; d++) {
        var cl = cells[d];
        if (grid[cl[0]][cl[1]]) continue;
        if (k === 1 && d > 0) break;
        var lineKeys = cells.map(function (x) { return key(x[0], x[1]); });
        if (k === 1) return { type: 'clue1', target: cl, cells: lineKeys, clues: [sd + i],
          text: SIDE_KO[sd] + ' 단서가 1이에요. 1채만 보이려면 맨 앞 건물이 뒤를 모두 가려야 해요. 그래서 단서 바로 옆 칸에는 가장 높은 건물이 와요. 몇 층일까요?' };
        return { type: 'clueN', target: cl, cells: lineKeys, clues: [sd + i],
          text: SIDE_KO[sd] + ' 단서가 ' + n + '예요. ' + n + '채가 모두 보이려면 단서 쪽에서부터 1층, 2층, 3층… 차례로 높아져야 해요. 이 칸은 앞에서 ' + (d + 1) + '번째 칸이에요.' };
      }
    }
    /* 3. 가로·세로줄만 보고 하나 남는 칸 */
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (grid[r][c]) continue;
      if (single(latin(r, c))) {
        var have = bits(full & ~latin(r, c));
        return { type: 'naked', target: [r, c], cells: rowcolCells(r, c), clues: [],
          text: '이 칸의 가로줄과 세로줄을 함께 보세요. 이미 ' + listKo(have) + '이 있어요. 남은 높이는 하나뿐이에요!' };
      }
    }
    /* 4. 한 줄에서 어떤 높이가 들어갈 자리가 하나뿐 (줄만 보고) */
    function hiddenSearch(useClue) {
      for (var ln = 0; ln < 2 * n; ln++) {
        var isRow = ln < n, idx = ln % n;
        for (var vv = 1; vv <= n; vv++) {
          var bit = 1 << (vv - 1), spots = [], filled = false, blockedByClue = false;
          for (var x = 0; x < n; x++) {
            var rr = isRow ? idx : x, cc = isRow ? x : idx;
            if (grid[rr][cc] === vv) { filled = true; break; }
            if (grid[rr][cc]) continue;
            var m = latin(rr, cc);
            if (useClue) { if ((m & bit) && !(clueMask[rr][cc] & bit)) blockedByClue = true; m &= clueMask[rr][cc]; }
            if (m & bit) spots.push([rr, cc]);
          }
          if (filled || spots.length !== 1) continue;
          if (useClue && !blockedByClue) continue;
          var t = spots[0], lineKeys = [];
          for (x = 0; x < n; x++) lineKeys.push(isRow ? key(idx, x) : key(x, idx));
          var lineName = (idx + 1) + (isRow ? '번째 가로줄' : '번째 세로줄');
          var cl2 = [];
          if (useClue) {
            for (x = 0; x < n; x++) {
              var r3 = isRow ? idx : x, c3 = isRow ? x : idx;
              clueWhy[r3][c3].forEach(function (w) { if (!(w.mask & bit) && cl2.indexOf(w.side + w.i) < 0) cl2.push(w.side + w.i); });
            }
          }
          return { type: useClue ? 'hiddenClue' : 'hidden', target: t, cells: lineKeys, clues: cl2,
            text: useClue
              ? lineName + '에서 ' + vv + '층이 들어갈 자리를 찾아봐요. 어떤 칸은 같은 줄에 이미 ' + vv + '층이 있고, 어떤 칸은 단서 때문에 ' + vv + '층이 못 와요(앞에 너무 높은 건물이 오면 뒤가 가려져서 단서 수만큼 보이지 않아요). 남은 자리는 한 곳뿐이에요.'
              : lineName + '에는 아직 ' + vv + '층이 없어요. 다른 빈칸들은 세로·가로로 이미 ' + vv + '층이 있는 줄에 걸려 있어요. ' + vv + '층이 들어갈 자리는 한 곳뿐이에요.' };
        }
      }
      return null;
    }
    var hs = hiddenSearch(false);
    if (hs) return hs;
    /* 5. 단서 제한까지 합치면 하나 남는 칸 */
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (grid[r][c]) continue;
      var lm = latin(r, c), m2 = lm & clueMask[r][c];
      if (!single(m2)) continue;
      var why = clueWhy[r][c].filter(function (w) { return lm & ~w.mask; });
      var cut = bits(lm & ~clueMask[r][c]);
      var w0 = why[0];
      var reason = '';
      if (w0) {
        var maxOk = bits(w0.mask).length;
        reason = SIDE_KO[w0.side] + ' 단서가 ' + w0.k + ((w0.k === 1 || w0.k === 3) ? '이에요. ' : '예요. ') + w0.k + '채가 보이려면 ' + (w0.d === 0 ? '단서 바로 옆 칸' : '단서에서 ' + (w0.d + 1) + '번째 칸') + '에는 ' + (maxOk + 1) + '층 이상이 올 수 없어요. 너무 높은 건물이 앞에 서면 뒤 건물이 가려지거든요.';
      }
      var have2 = bits(full & ~lm);
      return { type: 'nakedClue', target: [r, c], cells: rowcolCells(r, c), clues: why.map(function (w) { return w.side + w.i; }),
        text: (have2.length ? '가로·세로줄에 이미 ' + listKo(have2) + '이 있어요. ' : '') + reason + ' 남은 높이는 하나뿐이에요!' };
    }
    hs = hiddenSearch(true);
    if (hs) return hs;
    /* 6. 모두 채웠다면 */
    var empty = 0;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (!grid[r][c]) empty++;
    if (!empty) return { type: 'done', target: null, cells: [], clues: [], text: '모든 칸을 맞게 채웠어요! 정답 확인을 눌러 보세요.' };
    /* 7. 예비: 아무 빈칸 */
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (!grid[r][c]) return { type: 'other', target: [r, c], cells: rowcolCells(r, c), clues: [], text: '이 칸부터 생각해 봐요. 가로줄, 세로줄, 단서를 모두 함께 따져 보세요.' };
    return null;
  }
  function useHint() {
    if (!canEdit()) return;
    if (G.hint) { renderHintBox(); return; }
    if (G.hints <= 0) { toast('힌트를 모두 썼어요'); return; }
    var h = explainStep();
    if (!h) return;
    if (h.type !== 'done') { G.hints--; G.usedHint = true; persistGame(); }
    G.hint = h;
    if (h.target) G.sel = h.target;
    renderBoard(false); renderSide(); renderHintBox();
  }
  function hintReveal() {
    var h = G.hint;
    if (!h || !h.target || !canEdit()) return;
    var r = h.target[0], c = h.target[1], sol = G.puzzle.solution;
    if (h.type === 'wrong') { G.grid[r][c] = 0; G.memo[r][c] = 0; }
    else { G.grid[r][c] = sol[r][c]; G.memo[r][c] = 0; G.fixed[r][c] = 1; G.justPlaced = r + ',' + c; }
    afterChange(false);
  }
  function renderHintBox() {
    var box = $('hintBox');
    if (!box) return;
    if (!G || !G.hint || G.status !== 'play') { box.hidden = true; box.innerHTML = ''; return; }
    var h = G.hint;
    var act = '';
    if (h.type === 'wrong') act = '<button type="button" class="btn solid" id="hintDo">이 칸 지우기</button>';
    else if (h.target) act = '<button type="button" class="btn solid" id="hintDo">답 보기</button>';
    box.innerHTML = '<div class="hb-t"><span class="hb-ic">?</span>힌트</div><p>' + h.text + '</p><div class="hb-a">' + act + '<button type="button" class="btn" id="hintClose">닫기</button></div>';
    box.hidden = false;
    var d = $('hintDo'); if (d) d.addEventListener('click', hintReveal);
    $('hintClose').addEventListener('click', function () { G.hint = null; renderBoard(false); renderHintBox(); });
  }
  function checkAnswer() {
    if (!canEdit()) return;
    var n = G.n, sol = G.puzzle.solution, empty = 0, wrong = {}, wc = 0;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (!G.grid[r][c]) empty++;
      else if (G.grid[r][c] !== sol[r][c]) { wrong[r + ',' + c] = true; wc++; }
    }
    if (empty > 0) { toast('빈 칸이 ' + empty + '개 있어요'); return; }
    if (wc === 0) { onWin(); return; }
    if (G.mode === 'daily') {
      G.hearts--; G.lostHeart = true;
      if (G.hearts <= 0) { onLose(); return; }
      persistGame(); renderSide();
      var hh = $('hearts'); if (hh) hh.classList.add('shake');
      toast('틀린 칸이 ' + wc + '개 있어요. 하트가 하나 줄었어요');
    } else {
      G.wrong = wrong;
      renderBoard(false);
      toast('틀린 칸이 ' + wc + '개 있어요');
    }
  }

  function onWin() {
    G.status = 'win';
    if (G.mode === 'daily') {
      var gained = CONFIG.STARS_BASE[G.lv] + ((!G.usedHint && !G.lostHeart) ? CONFIG.STAR_BONUS : 0);
      var before = cityState();
      save.stars += gained; G.stars = gained;
      var after = cityState();
      persistGame();
      renderAll();
      var items = [];
      for (var i = before.built; i < after.built; i++) items.push({ k: BUILDINGS[i].k, text: BUILDINGS[i].name + ' 건물이 생겼어요!' });
      PROPS.forEach(function (p) { if (after.props.indexOf(p.id) >= 0 && before.props.indexOf(p.id) < 0) items.push({ k: p.k, text: p.name + '이(가) 생겼어요!' }); });
      var body = '<div class="bigstar">★ +' + gained + '</div><p>' + (gained > CONFIG.STARS_BASE[G.lv] ? '하트도 힌트도 아끼고 풀어서 보너스 ★이 붙었어요.' : '오늘의 ' + CONFIG.LEVELS[G.lv] + ' 퍼즐을 풀었어요.') + '</p>';
      if (items.length) body += '<div class="newitems">' + items.map(function (it) { return '<div class="newitem"><img src="' + imgUrl(it.k) + '" alt=""><span>' + it.text + '</span></div>'; }).join('') + '</div>';
      body += '<div class="row" style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px;color:var(--muted)">' + progressHTML(after) + '</div>';
      celebrate('star', function () { openModal('잘했어요!', body, [
        { label: '내 도시 보기', cls: 'gold', fn: function () { closeModal(); setView('city'); } },
        { label: '연습하기', cls: 'solid', fn: function () { startGame('practice', G.lv); } }
      ]); });
    } else {
      var today = todayKST();
      if (!save.brickDay || save.brickDay.date !== today) save.brickDay = { date: today, n: 0 };
      var pb = cityState(), got = save.brickDay.n < CONFIG.BRICK_DAILY_MAX;
      if (got) { save.brickDay.n++; save.bricks++; }
      save.prac.total++; if (G.lv === 'hard') save.prac.hard++;
      var pa = cityState();
      persist();
      renderAll();
      var pitems = [];
      PROPS.forEach(function (p) { if (pa.props.indexOf(p.id) >= 0 && pb.props.indexOf(p.id) < 0) pitems.push({ k: p.k, text: p.name + '이(가) 생겼어요!' }); });
      SPECIALS.forEach(function (sp) { if (pa.specials.indexOf(sp.id) >= 0 && pb.specials.indexOf(sp.id) < 0) pitems.push({ k: sp.k, text: '특별 장식 ' + sp.name + '이(가) 생겼어요!' }); });
      var pbody = got
        ? '<div class="bigstar" style="display:flex;align-items:center;gap:10px"><img src="images/brick.png" alt="" style="width:40px;height:auto">+1</div><p>연습 퍼즐을 풀어서 벽돌을 받았어요. 오늘 ' + save.brickDay.n + '/' + CONFIG.BRICK_DAILY_MAX + '개</p>'
        : '<p>오늘 벽돌은 다 모았어요 (' + CONFIG.BRICK_DAILY_MAX + '/' + CONFIG.BRICK_DAILY_MAX + '). 연습 기록은 계속 쌓여요.</p>';
      pbody += '<p style="color:var(--muted)">지금까지 연습 ' + save.prac.total + '판' + (save.prac.hard ? ' (어려움 ' + save.prac.hard + '판)' : '') + '</p>';
      if (pitems.length) pbody += '<div class="newitems">' + pitems.map(function (it) { return '<div class="newitem"><img src="' + imgUrl(it.k) + '" alt=""><span>' + it.text + '</span></div>'; }).join('') + '</div>';
      celebrate('brick', function () { openModal('잘했어요!', pbody, [
        { label: '새 퍼즐', cls: 'gold', fn: function () { startGame('practice', G.lv); } },
        { label: '오늘의 퍼즐', cls: 'solid', fn: function () { startGame('daily', G.lv); } }
      ]); });
    }
  }
  /* 퍼즐 완성 연출: 건물이 차례로 튀고 별(또는 벽돌)이 흩날린 뒤 축하 창 */
  function celebrate(kind, then) {
    var board = els.board, n = G.n;
    board.querySelectorAll('.cell').forEach(function (el) {
      var img = el.querySelector('.bld');
      if (img) { img.classList.add('cheer'); img.style.animationDelay = ((+el.dataset.r + +el.dataset.c) * 0.06).toFixed(2) + 's'; }
    });
    var fx = document.createElement('div');
    fx.className = 'fx';
    var colors = ['#ffd166', '#ff6b9a', '#5fd3f3', '#7ee08a', '#b493ff'];
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * Math.PI * 2, d = 140 + (i % 3) * 60;
      var sp = document.createElement('span');
      sp.className = 'pt';
      sp.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
      sp.style.setProperty('--dy', Math.round(Math.sin(a) * d) + 'px');
      sp.style.animationDelay = (0.25 + (i % 4) * 0.05).toFixed(2) + 's';
      if (kind === 'brick') sp.innerHTML = '<img src="images/brick.png" alt="">';
      else { sp.textContent = '★'; sp.style.color = colors[i % colors.length]; }
      fx.appendChild(sp);
    }
    board.parentElement.appendChild(fx);
    setTimeout(function () { if (fx.parentNode) fx.parentNode.removeChild(fx); }, 1500);
    setTimeout(then, 1000 + (n * 2) * 60);
  }
  function clueKey(R, C, n) {
    if (R === 0) return 'top' + (C - 1);
    if (R === n + 1) return 'bottom' + (C - 1);
    if (C === 0) return 'left' + (R - 1);
    return 'right' + (R - 1);
  }
  function onLose() {
    G.status = 'lose';
    persistGame();
    renderAll();
    openModal('하트를 모두 썼어요', '<p>오늘의 ' + CONFIG.LEVELS[G.lv] + ' 퍼즐은 여기까지예요. 정답을 판에 보여 드렸어요. 내일 새 퍼즐에 다시 도전해요!</p>', [
      { label: '연습하기', cls: 'gold', fn: function () { startGame('practice', G.lv); } },
      { label: '닫기', cls: 'solid', fn: closeModal }
    ]);
  }

  /* ===== 모달 ===== */
  function openModal(title, bodyHTML, actions) {
    lastFocus = document.activeElement;
    els.mTitle.textContent = title;
    els.mBody.innerHTML = bodyHTML;
    els.mActions.innerHTML = '';
    (actions || []).forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (a.cls || 'solid'); b.textContent = a.label;
      b.addEventListener('click', a.fn);
      els.mActions.appendChild(b);
    });
    els.modal.hidden = false;
    var first = els.mActions.querySelector('button');
    if (first) first.focus();
  }
  function closeModal() {
    if (els.modal.hidden) return;
    els.modal.hidden = true;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  /* ===== 놀이 방법: 짧은 3쪽 ===== */
  var helpPage = 0;
  function helpPages() {
    var ex = [2, 1, 4, 3], seen = [true, false, true, false], cols = '';
    ex.forEach(function (v, i) {
      cols += '<div class="hx-col' + (seen[i] ? '' : ' hid') + '"><img src="images/p' + v + '.png" alt="" style="height:' + Math.round(64 * BH[v] / BH[5]) + 'px"><span class="fl">' + v + '층</span><span class="tg">' + (seen[i] ? '보여요' : '가려져요') + '</span></div>';
    });
    var p1 = '<p class="hl">빈 칸에 <b>1층~5층</b> 건물을 하나씩 넣어요.<br>한 줄에 같은 높이는 한 번만!</p>' +
      '<div class="hx"><div class="hx-clue">2</div><div class="hx-eye">→</div>' + cols + '</div>' +
      '<p class="cap"><b>바깥 숫자</b>는 그쪽에서 보이는 건물 수예요.<br>높은 건물 뒤에 있는 낮은 건물은 가려져요.</p>';
    var p2 = '<ul class="tips">' +
      '<li><span class="tk">1</span><span>단서가 <b>1</b>이면 바로 앞 칸이 <b>5층</b>이에요.</span></li>' +
      '<li><span class="tk">5</span><span>단서가 <b>5</b>면 <b>1, 2, 3, 4, 5층</b> 차례로 서요.</span></li>' +
      '<li><span class="tk given"></span><span>진한 노란 칸은 처음부터 놓인 건물이에요. 여기서 시작해요.</span></li>' +
      '<li><span class="tk"><img src="images/p3.png" alt="" style="height:22px;width:auto"></span><span>아래에서 건물을 먼저 고르고 칸을 누르면 놓여요. 같은 칸을 한 번 더 누르거나 지우개를 골라 누르면 지워져요.</span></li>' +
      '<li><span class="tk memo">메모</span><span>헷갈리면 메모를 켜고 후보 숫자를 적어 두세요.</span></li></ul>';
    var p3 = '<ul class="tips">' +
      '<li><span class="tk heart">♥</span><span>오늘의 퍼즐: 정답 확인이 틀리면 하트가 줄어요.</span></li>' +
      '<li><span class="tk hint">?</span><span>힌트: 다음에 알 수 있는 칸과 이유를 알려 줘요. 오늘의 퍼즐 ' + CONFIG.HINTS + '번, 연습은 ' + CONFIG.PRACTICE_HINTS.easy + '/' + CONFIG.PRACTICE_HINTS.normal + '/' + CONFIG.PRACTICE_HINTS.hard + '번.</span></li>' +
      '<li><span class="tk star">★</span><span>오늘의 퍼즐을 풀면 별 → <b>건물</b>이 생겨요.</span></li>' +
      '<li><span class="tk brick"><img src="images/brick.png" alt=""></span><span>연습을 풀면 벽돌(하루 ' + CONFIG.BRICK_DAILY_MAX + '개) → <b>꾸미기</b>가 생겨요.</span></li></ul>';
    return [{ t: '규칙', b: p1 }, { t: '풀이 요령', b: p2 }, { t: '보상', b: p3 }];
  }
  function openHelp() { helpPage = 0; renderHelp(); save.seenHelp = true; persist(); }
  function renderHelp() {
    var pages = helpPages(), pg = pages[helpPage], last = helpPage === pages.length - 1;
    var dots = '<div class="hdots" aria-hidden="true">' + pages.map(function (x, i) { return '<i' + (i === helpPage ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
    var acts = [];
    if (helpPage > 0) acts.push({ label: '이전', cls: 'solid', fn: function () { helpPage--; renderHelp(); } });
    acts.push(last ? { label: '시작하기', cls: 'gold', fn: closeModal } : { label: '다음', cls: 'gold', fn: function () { helpPage++; renderHelp(); } });
    var wasOpen = !els.modal.hidden;
    var keep = lastFocus;
    openModal('놀이 방법 · ' + pg.t, '<div class="helpbody">' + pg.b + '</div>' + dots, acts);
    if (wasOpen) lastFocus = keep;
    var g = els.mActions.querySelector('.gold'); if (g) g.focus();
  }

  function setView(v) {
    view = v;
    renderAll();
    window.scrollTo(0, 0);
  }

  /* ===== 이벤트 ===== */
  document.querySelectorAll('#segMode button').forEach(function (b) {
    b.addEventListener('click', function () { startGame(b.dataset.mode, G ? G.lv : 'normal'); });
  });
  document.querySelectorAll('#segSize button').forEach(function (b) {
    b.addEventListener('click', function () { startGame(G ? G.mode : 'daily', b.dataset.lv); });
  });
  els.board.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell || !canEdit()) return;
    var r = +cell.dataset.r, c = +cell.dataset.c;
    if (!G.brush) { nudgePad(); return; }
    G.sel = [r, c];
    if (G.brush === 'erase') eraseCell(); else setValue(G.brush);
  });
  /* 놓는 방법은 하나: 아래에서 건물(또는 지우개)을 골라 두고 칸을 누른다 */
  var brushTip = false;
  function pickBrush(v) {
    if (!canEdit()) return;
    G.brush = G.brush === v ? null : v;
    renderSide();
    if (G.brush && !brushTip) { brushTip = true; toast(v === 'erase' ? '지우개를 골랐어요. 칸을 누르면 지워져요' : v + '층을 골랐어요. 칸을 누르면 바로 놓여요'); }
  }
  function nudgePad() {
    toast('먼저 아래에서 건물을 골라 주세요');
    var p = els.pad;
    p.classList.remove('nudge'); void p.offsetWidth; p.classList.add('nudge');
    setTimeout(function () { p.classList.remove('nudge'); }, 900);
  }
  els.pad.addEventListener('click', function (e) {
    var b = e.target.closest('.pbtn');
    if (b) pickBrush(+b.dataset.v);
  });
  els.memo.addEventListener('click', function () { if (canEdit()) { G.memoOn = !G.memoOn; renderSide(); } });
  els.erase.addEventListener('click', function () { pickBrush('erase'); });
  els.hint.addEventListener('click', useHint);
  els.check.addEventListener('click', checkAnswer);
  els.mini.addEventListener('click', function () { setView('city'); });
  $('btnCity').addEventListener('click', function () { setView('city'); });
  $('btnBack').addEventListener('click', function () { setView('puzzle'); });
  $('btnHelp').addEventListener('click', openHelp);
  $('btnTeacher').addEventListener('click', function () { DEMO = true; demoFill(); save.seen = sceneIds(cityState()); renderAll(); toast('교사용 시험 모드: 별과 벽돌은 저장되지 않아요'); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (els.modal.hidden && G && G.brush) { G.brush = null; renderSide(); return; } closeModal(); return; }
    if (!els.modal.hidden || view !== 'puzzle' || !canEdit()) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, n = G.n;
    if (/^[1-9]$/.test(k) && +k <= n) { setValue(+k); e.preventDefault(); return; }
    if (k === 'Backspace' || k === 'Delete' || k === '0') { eraseCell(); e.preventDefault(); return; }
    if (k === 'm' || k === 'M') { G.memoOn = !G.memoOn; renderSide(); return; }
    var d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (d) {
      var cur = G.sel || [0, 0];
      var nr = Math.max(0, Math.min(n - 1, cur[0] + (G.sel ? d[0] : 0)));
      var nc = Math.max(0, Math.min(n - 1, cur[1] + (G.sel ? d[1] : 0)));
      selectCell(nr, nc, true);
      e.preventDefault();
    }
  });

  /* ===== 시작 ===== */
  /* ===== 생각 오락실 통합 계정 ===== */
  function openAcc() { if (AA) AA.open({ game: 'sky', gameName: CONFIG.TITLE, color: '#ffd166', onPlay: function () {} }); }
  function showGate(on) { var g = $('gate'); if (g) g.hidden = !on; }
  function renderAcc() {
    var b = $('btnAcc');
    if (!b) return;
    b.hidden = !AA;
    b.textContent = me ? '1P ' + me.nick : '로그인';
  }
  function afterUser() {
    if (!save.seen) save.seen = sceneIds(cityState());
    renderAcc();
    startGame(G && !G.loading ? G.mode : 'daily', G && G.lv ? G.lv : 'normal');
    if (!save.seenHelp) setTimeout(openHelp, 160);
  }
  function takeServer(sv) {
    save = normalize(sv);
    if (!save.seen) save.seen = sceneIds(cityState());
    try { localStorage.setItem(ukey(me.nick), JSON.stringify(save)); } catch (e) {}
    setSync('ok');
    if (view === 'city') renderAll(); else startGame(G ? G.mode : 'daily', G ? G.lv : 'normal');
  }
  function setUser(a) {
    if (!a) {
      if (me) push(true);
      me = null; dirty = false; setSync('');
      save = freshSave(); save.seen = [];
      renderAcc(); showGate(true); renderAll();
      return;
    }
    if (me && me.nick === a.nick) { me.pin = a.pin; return; }
    if (me) push(true);
    me = { nick: a.nick, pin: a.pin }; dirty = false; DEMO = false;
    showGate(false);
    var local = null;
    try { local = JSON.parse(localStorage.getItem(ukey(a.nick)) || 'null'); } catch (e) {}
    save = normalize(local);
    setSync(SAVE_API ? 'load' : '');
    afterUser();
    if (!SAVE_API) return;
    var who = me;
    api({ action: 'load', nick: a.nick, pin: a.pin }).then(function (j) {
      if (me !== who) return;
      if (!j.ok) {
        if (j.code === 'OLD') { oldPage(); return; }
        if (['PIN', 'NOUSER', 'BLOCKED'].indexOf(j.code) >= 0) { AA.logout(); return; }
        setSync('off'); if (local) dirty = true; return;
      }
      var sv = j.data, sr = (sv && sv.rev) || 0, lr = (local && local.rev) || 0;
      if (sv && (sr > lr || !local || (sv.t || 0) >= (local.t || 0))) takeServer(sv);
      else if (local) { dirty = true; push(); }
      else setSync('ok');
    }).catch(function () { if (me === who) { if (local) dirty = true; setSync('off'); } });
  }
  if (AA) {
    $('gateBtn').addEventListener('click', openAcc);
    $('btnAcc').addEventListener('click', openAcc);
    AA.onChange(setUser);
    var a0 = AA.get();
    if (a0) { setUser(a0); AA.refresh(); }
    else { showGate(true); renderAcc(); openAcc(); }
  } else {
    renderAcc();
    startGame('daily', 'normal');
    if (!save.seenHelp) setTimeout(openHelp, 120);
  }
})();
</script>

</body>
</html>
